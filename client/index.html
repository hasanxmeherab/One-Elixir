<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/oneelixir.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OneElixir Fragrances — Premium handcrafted perfumes and bespoke fragrances. Shop exclusive scents crafted in small batches." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://oneelixir.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneElixir" />
    <meta property="og:title" content="OneElixir — Premium Handcrafted Fragrances" />
    <meta property="og:description" content="Shop exclusive scents crafted in small batches. Bespoke perfumes for the discerning." />
    <meta property="og:url" content="https://oneelixir.vercel.app/" />
    <title>OneElixir — Premium Handcrafted Fragrances</title>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "OneElixir",
      "url": "https://oneelixir.vercel.app",
      "logo": "https://oneelixir.vercel.app/oneelixir.png",
      "description": "Premium handcrafted perfumes and bespoke fragrances.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "url": "https://oneelixir.vercel.app"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "OneElixir",
      "url": "https://oneelixir.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://oneelixir.vercel.app/collection?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

    <script type="module" src="/src/main.jsx"></script>
